<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>LifeChoices — Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>LifeChoices — Interests Pie Chart</h2>
  <p>Enter name or secret to view:</p>
  <input id="in" placeholder="name or secret"/>
  <button id="ok">View</button>
  <div id="err" style="color:red"></div>
  <canvas id="pie" width="400" height="400" style="max-width:600px"></canvas>

<script>
const GAS_URL = 'https://script.google.com/d/1NxcW9qRuNkpTrKY4XJw0sioM3BKzmtUsmeGC82g6tEcD5O2SWAmIkJvW/edit?usp=sharing'; // same as before
document.getElementById('ok').onclick = async ()=>{
  const key = document.getElementById('in').value.trim();
  if (!key) return document.getElementById('err').textContent='Enter a key';
  document.getElementById('err').textContent='Loading...';
  try {
    const res = await fetch(GAS_URL + '?action=aggregate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ nameOrSecret: key })
    });
    const j = await res.json();
    if (!j.ok) { document.getElementById('err').textContent = 'Not authorized or empty'; return; }
    const data = j.aggregated;
    const labels = data.map(x=>x.label);
    const values = data.map(x=>x.value);

    const ctx = document.getElementById('pie').getContext('2d');
    if (window.chart) window.chart.destroy();
    window.chart = new Chart(ctx, {
      type: 'pie',
      data: { labels: labels, datasets:[{data: values}] },
      options: {}
    });
    document.getElementById('err').textContent='';
  } catch(err) {
    document.getElementById('err').textContent = 'Error fetching data';
  }
};
</script>
</body>
</html>
