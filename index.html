<!DOCTYPE html>
<html>
<body>
<h2>Choose 3 Interests</h2>

<label><input type="checkbox" value="Food"> Food</label><br>
<label><input type="checkbox" value="Travel"> Travel</label><br>
<label><input type="checkbox" value="Sports"> Sports</label><br>
<label><input type="checkbox" value="Music"> Music</label><br>
<label><input type="checkbox" value="Games"> Games</label><br>
<br>

<button onclick="submitChoices()">Submit</button>

<p id="msg"></p>

<script>
const API = "https://script.google.com/d/1NxcW9qRuNkpTrKY4XJw0sioM3BKzmtUsmeGC82g6tEcD5O2SWAmIkJvW/edit?usp=sharing"; // Replace after Deploy

function submitChoices() {
  const selected = [...document.querySelectorAll("input:checked")].map(e => e.value);
  if (selected.length !== 3) {
    document.getElementById("msg").innerHTML = "Choose exactly 3!";
    return;
  }

  fetch(API, {
    method: "POST",
    contentType: "application/json",
    body: JSON.stringify({ choices: selected })
  })
  .then(r => r.json())
  .then(res => {
    document.getElementById("msg").innerHTML = "Recorded! Your ID: " + res.user;
  });
}
</script>
</body>
</html>
