<!DOCTYPE html>
<html>
<body>
<h2>Choose 3 Interests</h2>

<label><input type="checkbox" value="Food"> Food</label><br>
<label><input type="checkbox" value="Travel"> Travel</label><br>
<label><input type="checkbox" value="Sports"> Sports</label><br>
<label><input type="checkbox" value="Music"> Music</label><br>
<label><input type="checkbox" value="Games"> Games</label><br>
<br>

<button onclick="submitChoices()">Submit</button>

<p id="msg"></p>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwl7X238HBtiy_OzZ4jIEA4sPxwrdAaJDfc67BWQ2OIXBe4FxemAEONHUoOUit06-JPHQ/exec";

function submitChoices() {
  const selected = [...document.querySelectorAll('input:checked')].map(i => i.value);

  if (selected.length !== 3) {
    alert("Please select exactly 3 interests!");
    return;
  }

  const userKey = "anon_" + Date.now();

  fetch(SCRIPT_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ [userKey]: selected })
  })
  .then(response => response.json())
  .then(data => {
    console.log("Saved:", data);
    alert("Thanks! Your choices are recorded anonymously ✔");
  })
  .catch(err => {
    console.error("Error:", err);
    alert("Something went wrong ❌");
  });
}
</script>
</body>
</html>
