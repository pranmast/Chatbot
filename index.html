<!DOCTYPE html>
<html>
<head>
<title>Anonymous Life Choice Chatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial, sans-serif; background:#f4f4f4; padding:20px; text-align:center; }
.chatbox { background:white; padding:20px; border-radius:10px; max-width:500px; margin:auto; box-shadow:0 0 10px #ccc; }
.messages { height:300px; overflow-y:auto; border:1px solid #ddd; margin-bottom:10px; padding:10px; border-radius:5px; text-align:left; }
input { width:75%; padding:10px; border-radius:5px; border:1px solid #aaa; }
button { padding:10px; border:none; border-radius:5px; background:#007bff; color:white; cursor:pointer; }
button:hover { background:#0056b3; }
</style>
</head>

<body>
<h2>🌍 Anonymous Choice Chatbot</h2>
<div class="chatbox">
  <div class="messages" id="messages"></div>

  <input type="text" id="userInput" placeholder="Type your favorite interest…">
  <button onclick="sendMsg()">Send</button>
</div>

<script>
const scriptURL = "https://script.google.com/d/1NxcW9qRuNkpTrKY4XJw0sioM3BKzmtUsmeGC82g6tEcD5O2SWAmIkJvW/edit?usp=sharing";

function sendMsg() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  addMsg("🧍 You: " + text);

  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify({ interest: text })
  }).then(() => {
    addMsg("🤖 Bot: Recorded anonymously!");
  }).catch(() => {
    addMsg("⚠ Failed to record.");
  });

  input.value = "";
}

function addMsg(txt) {
  const box = document.getElementById("messages");
  box.innerHTML += "<div>" + txt + "</div>";
  box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
