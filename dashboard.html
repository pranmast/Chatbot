<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h2>World Interest Map</h2>
<canvas id="pieChart" width="300" height="300"></canvas>

<script>
const API = "https://script.google.com/macros/s/AKfycbyQDPmkUyOTGl1HOpXTJ4tYhkSsBE8Ys8JGq3pPxnu5M-_2VfwlSVdeRcq16iwRtBjr9w/exec"; // Replace after Deploy

fetch(API)
  .then(r => r.json())
  .then(data => {
    let freq = {};

    Object.values(data).forEach(arr => {
      arr.forEach(item => {
        freq[item] = (freq[item] || 0) + 1;
      });
    });

    new Chart(document.getElementById("pieChart"), {
      type: "pie",
      data: {
        labels: Object.keys(freq),
        datasets: [{
          data: Object.values(freq)
        }]
      }
    });
  });
</script>
</body>
</html>
